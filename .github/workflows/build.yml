name: Build and Push Worker Python Runtime

# Publishes a distribution-only image (busybox:1.37.0-musl + one file,
# /runtime.tar.gz) that already contains worker.py/storage.py. Backend pulls
# and republishes those exact bytes as the content-addressed worker bundle --
# see this repo's README and Dockerfile header. Published
# public: nothing in this tarball is secret (a stock CPython build plus
# ordinary open-source wheels), and Azure needs to pull it without a
# registry credential the same way aci-worker's own image does. GHCR
# container package visibility can't be flipped by this workflow's own
# GITHUB_TOKEN (needs a PAT with repo + write:packages scope, or the
# GitHub UI) -- set to public once, manually, after this workflow's
# first successful push (package Settings -> Change visibility).

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'worker.py'
      - 'storage.py'
      - 'test_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/worker-python-runtime
  # Fixed value, not `date +%s` at run time: BuildKit's SOURCE_DATE_EPOCH
  # build-arg normalizes image-config `created` and layer timestamps to
  # this instead of each run's own wall clock, which is what actually
  # lets two builds from identical source converge on the same digest --
  # same pin extra/build-attest-api/Dockerfile uses in
  # directionallyai/linuxkit-attestable-ami.
  SOURCE_DATE_EPOCH: "1788613323"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's own verify stage (extract, run the interpreter,
      # import every pinned dependency, exercise AESGCM/h2, confirm the
      # unprivileged-uid case, confirm `runtime`'s own exec chain) is
      # already part of the build graph -- a failure there fails this
      # step, nothing further to check here. Built locally first (not
      # pushed) purely so a build failure shows up before anything is
      # published under :dev.
      # `outputs:` (raw buildx syntax), not the action's own `tags:`/`push:`/
      # `load:` inputs: confirmed live, in directionallyai/github-to-private-key
      # and directionallyai/aci-worker's own workflows, that SOURCE_DATE_EPOCH
      # alone normalizes the image config's own `created` field but NOT
      # individual file mtimes inside a layer -- rewrite-timestamp=true (the
      # same option extra/build-attest-api/build-deterministic.sh's own
      # OCI-tar export already uses in directionallyai/linuxkit-attestable-ami)
      # fixes it, but is only reachable through this raw syntax.
      - name: Build image (local, for verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=docker,name=worker-python-runtime:verify,rewrite-timestamp=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `outputs:` name= accepts a comma-separated list for multiple tags in
      # one push, quoted so buildx doesn't mistake the tag-list commas for
      # the outer type=image,name=...,push=...  key separators.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: 'type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",push=true,rewrite-timestamp=true'
          cache-from: type=gha
          cache-to: type=gha,mode=max
